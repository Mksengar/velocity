<script>

    const registerForm =
        document.getElementById("registerForm");

    const registerButton =
        document.getElementById("registerButton");

    const registerButtonText =
        document.getElementById("registerButtonText");

    const registerSpinner =
        document.getElementById("registerSpinner");

    const registerAlert =
        document.getElementById("registerAlert");

    const passwordInput =
        document.getElementById("password");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const togglePassword =
        document.getElementById("togglePassword");

    const toggleConfirmPassword =
        document.getElementById("toggleConfirmPassword");

    const strengthProgress =
        document.getElementById("strengthProgress");

    const strengthText =
        document.getElementById("strengthText");


    // ==========================================
    // SHOW / HIDE PASSWORD
    // ==========================================

    function setupPasswordToggle(button, input) {

        button.addEventListener("click", function () {

            if (input.type === "password") {

                input.type = "text";

                this.innerHTML =
                    '<i class="bi bi-eye-slash"></i>';

                this.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                input.type = "password";

                this.innerHTML =
                    '<i class="bi bi-eye"></i>';

                this.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        });

    }


    setupPasswordToggle(
        togglePassword,
        passwordInput
    );

    setupPasswordToggle(
        toggleConfirmPassword,
        confirmPasswordInput
    );


    // ==========================================
    // PASSWORD STRENGTH
    // ==========================================

    passwordInput.addEventListener(
        "input",
        function () {

            const password =
                passwordInput.value;

            let strength = 0;

            if (password.length >= 8) {
                strength++;
            }

            if (/[A-Z]/.test(password)) {
                strength++;
            }

            if (/[a-z]/.test(password)) {
                strength++;
            }

            if (/[0-9]/.test(password)) {
                strength++;
            }

            if (/[^A-Za-z0-9]/.test(password)) {
                strength++;
            }


            if (password.length === 0) {

                strengthProgress.style.width =
                    "0%";

                strengthText.textContent =
                    "Use at least 8 characters.";

            } else if (strength <= 2) {

                strengthProgress.style.width =
                    "35%";

                strengthText.textContent =
                    "Weak password";

            } else if (strength <= 3) {

                strengthProgress.style.width =
                    "60%";

                strengthText.textContent =
                    "Medium password";

            } else {

                strengthProgress.style.width =
                    "100%";

                strengthText.textContent =
                    "Strong password";

            }

        }
    );


    // ==========================================
    // ALERT
    // ==========================================

    function showAlert(message, type = "error") {

        registerAlert.textContent =
            message;

        registerAlert.className =
            "register-alert " + type;

    }


    function hideAlert() {

        registerAlert.textContent =
            "";

        registerAlert.className =
            "register-alert";

    }


    // ==========================================
    // LOADING STATE
    // ==========================================

    function setLoading(loading) {

        registerButton.disabled =
            loading;

        if (loading) {

            registerButtonText.textContent =
                "Creating Account...";

            registerSpinner.style.display =
                "inline-block";

        } else {

            registerButtonText.textContent =
                "Create Account";

            registerSpinner.style.display =
                "none";

        }

    }


    // ==========================================
    // FORM SUBMISSION
    // ==========================================

    registerForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            hideAlert();


            // Get values

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;

            const termsAccepted =
                document
                    .getElementById("terms")
                    .checked;


            // ==========================================
            // VALIDATION
            // ==========================================

            if (!name || !email || !password ||
                !confirmPassword) {

                showAlert(
                    "Please fill in all required fields."
                );

                return;
            }


            if (name.length < 2) {

                showAlert(
                    "Name must contain at least 2 characters."
                );

                return;
            }


            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (!emailPattern.test(email)) {

                showAlert(
                    "Please enter a valid email address."
                );

                return;
            }


            if (password.length < 8) {

                showAlert(
                    "Password must contain at least 8 characters."
                );

                return;
            }


            if (password !== confirmPassword) {

                showAlert(
                    "Passwords do not match."
                );

                return;
            }


            if (!termsAccepted) {

                showAlert(
                    "Please accept the Terms of Service and Privacy Policy."
                );

                return;
            }


            setLoading(true);


            // ==========================================
            // SEND REQUEST TO FLASK
            // ==========================================

            try {

                /*
                 * Flask endpoint:
                 *
                 * POST
                 * http://127.0.0.1:5000/api/auth/register
                 */

                const API_URL =
                    "http://127.0.0.1:5000/api/auth/register";


                const response =
                    await fetch(API_URL, {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            name: name,

                            email: email,

                            password: password

                        })

                    });


                let data = {};

                try {

                    data =
                        await response.json();

                } catch (jsonError) {

                    data = {};

                }


                // ==========================================
                // ERROR RESPONSE
                // ==========================================

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        data.error ||
                        "Registration failed. Please try again."
                    );

                }


                // ==========================================
                // SUCCESS
                // ==========================================

                showAlert(
                    data.message ||
                    "Account created successfully! Redirecting to login...",
                    "success"
                );


                registerForm.reset();

                strengthProgress.style.width =
                    "0%";

                strengthText.textContent =
                    "Use at least 8 characters.";


                setTimeout(function () {

                    window.location.href =
                        "login.html";

                }, 1200);


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );


                showAlert(
                    error.message ||
                    "Unable to connect to the server."
                );

            } finally {

                setLoading(false);

            }

        }
    );


    // ==========================================
    // TERMS / PRIVACY
    // ==========================================

    document
        .getElementById("termsLink")
        .addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                alert(
                    "Terms of Service will be available soon."
                );

            }
        );


    document
        .getElementById("privacyLink")
        .addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                alert(
                    "Privacy Policy will be available soon."
                );

            }
        );

</script>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
